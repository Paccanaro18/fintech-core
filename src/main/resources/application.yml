spring:
  application:
    name: fintech
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fintechdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:chave-padrao-apenas-para-desenvolvimento-local-trocar-em-producao}
  expiration: 86400000